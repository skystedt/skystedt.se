version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "10:00"
      timezone: "Europe/Stockholm"
    cooldown:
      default-days: 0
    groups:
      github-actions:
        patterns:
          - "actions/*"
      codeql:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: "dotnet-sdk"
    directory: "/src"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "10:00"
      timezone: "Europe/Stockholm"
    cooldown:
      default-days: 0

  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "10:00"
      timezone: "Europe/Stockholm"
    cooldown:
      default-days: 0
    groups:
      api:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/src/Client"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "10:00"
      timezone: "Europe/Stockholm"
    cooldown:
      default-days: 0
    open-pull-requests-limit: 10
    groups:
      babel:
        patterns:
          - "@babel/*"
          - "babel-*"
      client-development:
        patterns:
          - "*" # dependabot gives an overlapping dependency to the most specific group, not the first one, without patterns this group would outrank other groups
        dependency-type: "development"
        update-types:
          - minor
          - patch

  - package-ecosystem: "npm"
    directory: "/src/Client/deploy"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "10:00"
      timezone: "Europe/Stockholm"
    cooldown:
      default-days: 0

  - package-ecosystem: "npm"
    directory: "/src/Client/package-manager"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "10:00"
      timezone: "Europe/Stockholm"
    cooldown:
      default-days: 0
