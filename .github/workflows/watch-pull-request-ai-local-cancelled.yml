name: Watch - Pull Request AI Local Cancelled

on:
  workflow_run:
    workflows: ["Pull Request"]
    types: [completed]

permissions: {} # permissions are specified on each job

env:
  REVIEW_JOB_NAME: "Local LLM Review" # the job name from the reusable workflow, the caller prefixes its own name
  MAX_ATTEMPTS: "5" # total runs, including the first one
  WAIT_STEP_MINUTES: "10" # the first rerun waits this long, every further one waits this much longer again

jobs:
  rerun:
    name: Rerun AI Review Local
    if: github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-latest

    permissions:
      actions: write # to rerun the job
      contents: read

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || 'missing' }}

    steps:
      - name: Find Cancelled Review Job
        id: find
        run: |
          JOBS=$(gh api "repos/{owner}/{repo}/actions/runs/$RUN_ID/jobs")
          JOB_ID=$(echo "$JOBS" | jq -r --arg name "$REVIEW_JOB_NAME" 'first(.jobs[] | select((.name | endswith($name)) and .conclusion == "cancelled") | .id) // empty')

          if [ -z "$JOB_ID" ]; then
            echo "The review job of PR #$PR_NUMBER was not cancelled, nothing to rerun"
          elif [ "$RUN_ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
            JOB_ID=""
            echo "The review of PR #$PR_NUMBER has been run $RUN_ATTEMPT times of at most $MAX_ATTEMPTS, giving up"
          else
            echo "The review job of PR #$PR_NUMBER was cancelled, job id $JOB_ID, run attempt $RUN_ATTEMPT of at most $MAX_ATTEMPTS"
          fi

          echo "id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Wait Before Rerunning
        if: steps.find.outputs.id != ''
        run: |
          WAIT_SECONDS=$(( RUN_ATTEMPT * WAIT_STEP_MINUTES * 60 ))
          echo "The review of PR #$PR_NUMBER was cancelled, waiting $(( WAIT_SECONDS / 60 )) minutes before rerunning"
          sleep "$WAIT_SECONDS"

      - name: Rerun Review Job
        if: steps.find.outputs.id != ''
        run: |
          # the rerun reviews the commit the run was started for, only rerun while that is still the head
          CURRENT_SHA=$(gh api "repos/{owner}/{repo}/commits/$HEAD_BRANCH" --jq '.sha') || CURRENT_SHA=""

          if [ -z "$CURRENT_SHA" ]; then
            echo "$HEAD_BRANCH cannot be read, it has most likely been deleted, skipping the rerun"
            exit 0
          elif [ "$CURRENT_SHA" != "$HEAD_SHA" ]; then
            echo "$HEAD_BRANCH moved from $HEAD_SHA to $CURRENT_SHA, the run started for it reviews the new head, skipping the rerun"
            exit 0
          fi

          if gh run rerun "$RUN_ID" --failed; then
            echo "Rerunning the review of PR #$PR_NUMBER at $HEAD_SHA, see $RUN_URL"
          else
            echo "::warning::Unable to rerun the review of PR #$PR_NUMBER, it stays pending until the next scheduled retry"
          fi

