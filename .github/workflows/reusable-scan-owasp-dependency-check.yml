name: Reusable - Scan OWASP Dependency Check

on:
  workflow_call:
    inputs:
      upload-sarif:
        description: Upload the SARIF result to code scanning
        type: boolean
        default: true
      report-pull-request:
        description: Open, update, or close the tracking pull request based on the result
        type: boolean
        default: true
      fail-on-vulnerable:
        description: Fail the workflow when vulnerabilities are found that are not already known on the baseline branch
        type: boolean
        default: false

# permissions are inherited from the caller

env:
  BASELINE_BRANCH: "main"
  BASELINE_DIR: "baseline"
  BASELINE_WORKFLOW: "schedule-scan-owasp-dependency-check.yml"
  TOOL_NAME: "dependency-check"

jobs:
  scan:
    name: Scan Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Scan For Vulnerabilities
        id: scan
        uses: ./.github/composite/scan-owasp-dependency-check
        with:
          checkout-dir: ${{ github.workspace }}

      - name: Compare With Baseline Alerts
        id: alerts
        uses: ./.github/composite/scan-result-compare
        with:
          sarif-file: ${{ steps.scan.outputs.sarif-file }}
          tool-name: ${{ env.TOOL_NAME }}

      - name: Checkout Baseline
        id: baseline-checkout
        if: ${{ inputs.fail-on-vulnerable && steps.alerts.outputs.added-count != '0' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ env.BASELINE_BRANCH }}
          path: ${{ env.BASELINE_DIR }}

      - name: Scan Baseline For Vulnerabilities
        id: baseline-scan
        if: ${{ steps.baseline-checkout.outcome == 'success' }}
        uses: ./.github/composite/scan-owasp-dependency-check
        with:
          checkout-dir: ${{ github.workspace }}/${{ env.BASELINE_DIR }}

      - name: Compare With Baseline
        id: compare
        uses: ./.github/composite/scan-result-compare
        with:
          sarif-file: ${{ steps.scan.outputs.sarif-file }}
          baseline-sarif-file: ${{ steps.baseline-scan.outputs.sarif-file }}
          tool-name: ${{ env.TOOL_NAME }}

      - name: Compare Baseline With Baseline Alerts
        id: baseline-alerts
        if: ${{ steps.baseline-scan.outcome == 'success' }}
        uses: ./.github/composite/scan-result-compare
        with:
          sarif-file: ${{ steps.baseline-scan.outputs.sarif-file }}
          tool-name: ${{ env.TOOL_NAME }}

      - name: Dispatch Baseline Scan
        if: ${{ steps.baseline-alerts.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh workflow run "$BASELINE_WORKFLOW" --ref "$BASELINE_BRANCH"; then
            echo "Dispatched $BASELINE_WORKFLOW on $BASELINE_BRANCH to refresh its code scanning alerts"
          else
            echo "::warning::Unable to dispatch $BASELINE_WORKFLOW on $BASELINE_BRANCH, its code scanning alerts stay stale until the next scheduled scan"
          fi

      - name: Upload Report
        id: upload-report
        if: ${{ steps.compare.outputs.changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          path: ${{ steps.scan.outputs.html-file }}
          archive: false

      - name: Upload SARIF
        if: ${{ inputs.upload-sarif }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # 4.37.8
        with:
          sarif_file: ${{ steps.scan.outputs.sarif-file }}
          category: owasp-dependency-check

      - name: Evaluate Scan Result
        id: evaluate
        env:
          JSON_FILE: ${{ steps.scan.outputs.json-file }}
          REPORT_URL: ${{ steps.upload-report.outputs.artifact-url }}
          CHANGES: ${{ steps.compare.outputs.changes }}
        run: |
          SUMMARY=$(jq -c '[.dependencies[]? | select(.vulnerabilities) | {fileName, filePath, vulnerabilities: [.vulnerabilities[] | {name, severity}]}]' "$JSON_FILE")

          VULNERABLE=$(jq -r '[.[].vulnerabilities[]] | length' <<< "$SUMMARY")
          echo "vulnerable=$VULNERABLE" >> "$GITHUB_OUTPUT"
          echo "Found $VULNERABLE vulnerabilities, ${{ steps.compare.outputs.added-count }} of them new"

          {
            echo "summary<<EOF_SUMMARY"
            if [ -n "$REPORT_URL" ]; then
              echo "Full report: $REPORT_URL"
            fi
            if [ -n "$CHANGES" ]; then
              echo "$CHANGES"
            fi
            echo '```'
            jq . <<< "$SUMMARY"
            echo '```'
            echo "EOF_SUMMARY"
          } >> "$GITHUB_OUTPUT"

      - name: Fail If New Vulnerabilities
        if: ${{ inputs.fail-on-vulnerable && steps.compare.outputs.added-count != '0' }}
        env:
          SUMMARY: ${{ steps.evaluate.outputs.summary }}
        run: |
          {
            echo "## Vulnerabilities found by OWASP Dependency-Check"
            echo "$SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::OWASP Dependency-Check found ${{ steps.compare.outputs.added-count }} new vulnerabilities, out of ${{ steps.evaluate.outputs.vulnerable }} in total"
          exit 1

      - name: Report Pull Request
        if: ${{ inputs.report-pull-request }}
        uses: ./.github/composite/report-pull-request
        with:
          branch-name: "vulnerability-scan/owasp-dependency-check"
          open: ${{ steps.evaluate.outputs.vulnerable != '0' }}
          changed: ${{ steps.compare.outputs.changed }}
          title: "Vulnerabilities found by OWASP Dependency-Check"
          summary: ${{ steps.evaluate.outputs.summary }}
