name: Reusable - Scan OWASP Dependency Check

on:
  workflow_call:
    inputs:
      upload-sarif:
        description: Upload the SARIF result to code scanning
        type: boolean
        default: true
      report-pull-request:
        description: Open, update, or close the tracking pull request based on the result
        type: boolean
        default: true
      fail-on-vulnerable:
        description: Fail the workflow when vulnerabilities are found that are not already known on the baseline branch
        type: boolean
        default: false

# permissions are inherited from the caller

env:
  SRC_DIR: "src"
  REPORT_NAME: "dependency-check-report"
  SUPPRESSION_FILE: ".github/dependency-check/suppression.xml"
  IMAGE: "owasp/dependency-check-action:latest" # Rebuilt nightly with an updated NVD dataset, so version is not pinned

jobs:
  scan:
    name: Scan Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Scan For Vulnerabilities
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            "$IMAGE" \
            --scan "/src/$SRC_DIR" \
            --format JSON \
            --format HTML \
            --format SARIF \
            --out "/src/$REPORT_NAME" \
            --suppression "/src/$SUPPRESSION_FILE" \
            --noupdate
          cat "$REPORT_NAME/$REPORT_NAME.json"

      - name: Compare With Baseline
        id: compare
        uses: ./.github/composite/code-scanning-alerts-compare
        with:
          sarif-file: ${{ env.REPORT_NAME }}/${{ env.REPORT_NAME }}.sarif
          tool-name: "dependency-check"

      - name: Upload Report
        id: upload-report
        if: ${{ steps.compare.outputs.changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          path: ${{ env.REPORT_NAME }}/${{ env.REPORT_NAME }}.html
          archive: false

      - name: Upload SARIF
        if: ${{ inputs.upload-sarif }}
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # 4.37.3
        with:
          sarif_file: ${{ env.REPORT_NAME }}/${{ env.REPORT_NAME }}.sarif
          category: owasp-dependency-check

      - name: Evaluate Scan Result
        id: evaluate
        env:
          REPORT_URL: ${{ steps.upload-report.outputs.artifact-url }}
          CHANGES: ${{ steps.compare.outputs.changes }}
        run: |
          SUMMARY=$(jq -c '[.dependencies[]? | select(.vulnerabilities) | {fileName, filePath, vulnerabilities: [.vulnerabilities[] | {name, severity}]}]' "$REPORT_NAME/$REPORT_NAME.json")

          VULNERABLE=$(jq -r '[.[].vulnerabilities[]] | length' <<< "$SUMMARY")
          echo "vulnerable=$VULNERABLE" >> "$GITHUB_OUTPUT"
          echo "Found $VULNERABLE vulnerabilities, ${{ steps.compare.outputs.added-count }} of them new"

          {
            echo "summary<<EOF_SUMMARY"
            if [ -n "$REPORT_URL" ]; then
              echo "Full report: $REPORT_URL"
            fi
            if [ -n "$CHANGES" ]; then
              echo "$CHANGES"
            fi
            echo '```'
            jq . <<< "$SUMMARY"
            echo '```'
            echo "EOF_SUMMARY"
          } >> "$GITHUB_OUTPUT"

      - name: Fail If New Vulnerabilities
        if: ${{ inputs.fail-on-vulnerable && steps.compare.outputs.added-count != '0' }}
        env:
          SUMMARY: ${{ steps.evaluate.outputs.summary }}
        run: |
          {
            echo "## Vulnerabilities found by OWASP Dependency-Check"
            echo "$SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::OWASP Dependency-Check found ${{ steps.compare.outputs.added-count }} new vulnerabilities, out of ${{ steps.evaluate.outputs.vulnerable }} in total"
          exit 1

      - name: Report Pull Request
        if: ${{ inputs.report-pull-request }}
        uses: ./.github/composite/report-pull-request
        with:
          branch-name: "vulnerability-scan/owasp-dependency-check"
          open: ${{ steps.evaluate.outputs.vulnerable != '0' }}
          changed: ${{ steps.compare.outputs.changed }}
          title: "Vulnerabilities found by OWASP Dependency-Check"
          summary: ${{ steps.evaluate.outputs.summary }}
