name: Reusable - Approve Dependabot

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  approve:
    name: Approve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Dependabot Group
        id: group
        uses: ./.github/composite/dependabot-group

      - name: Approve
        if: steps.group.outputs.approve == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GROUP: ${{ steps.group.outputs.group }}
        run: |
          # one approval per commit, the approval states that CI passed on it
          APPROVAL=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and .state == \"APPROVED\" and .commit_id == \"$HEAD_SHA\") | .id")

          if [ -n "$APPROVAL" ]; then
            echo "Commit $HEAD_SHA is already approved"
          else
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
              -f event=APPROVE \
              -f commit_id="$HEAD_SHA" \
              -f body="Approved automatically: .github/dependabot.yml tags the $GROUP group for approval, and CI passed on this commit." > /dev/null
            echo "Approved $HEAD_SHA for the $GROUP group"
          fi
