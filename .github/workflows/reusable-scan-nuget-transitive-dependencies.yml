name: Reusable - Scan NuGet Transitive Dependencies

on:
  workflow_call:
    inputs:
      upload-sarif:
        description: Upload the SARIF result to code scanning
        type: boolean
        default: true
      report-pull-request:
        description: Open, update, or close the tracking pull request based on the result
        type: boolean
        default: true
      fail-on-vulnerable:
        description: Fail the workflow when vulnerabilities are found that are not already known on the baseline branch
        type: boolean
        default: false

# permissions are inherited from the caller

env:
  SRC_DIR: "src"
  PACKAGE_LEVELS: "transitivePackages" # space-separated dotnet-list-package framework levels to scan
  BASELINE_BRANCH: "main"
  BASELINE_DIR: "baseline"
  BASELINE_WORKFLOW: "schedule-scan-nuget-transitive-dependencies.yml"
  TOOL_NAME: "dotnet-list-package-vulnerable"

jobs:
  scan:
    name: Scan NuGet Transitive Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Dotnet Setup
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # 6.0.0
        with:
          global-json-file: ${{ env.SRC_DIR }}/global.json

      - name: Scan For Vulnerable Packages
        id: scan
        uses: ./.github/composite/scan-nuget-transitive-dependencies
        with:
          checkout-dir: ${{ github.workspace }}
          package-levels: ${{ env.PACKAGE_LEVELS }}

      - name: Compare With Baseline Alerts
        id: alerts
        uses: ./.github/composite/scan-result-compare
        with:
          sarif-file: ${{ steps.scan.outputs.sarif-file }}
          tool-name: ${{ env.TOOL_NAME }}

      - name: Checkout Baseline
        id: baseline-checkout
        if: ${{ inputs.fail-on-vulnerable && steps.alerts.outputs.added-count != '0' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ env.BASELINE_BRANCH }}
          path: ${{ env.BASELINE_DIR }}

      - name: Scan Baseline For Vulnerable Packages
        id: baseline-scan
        if: ${{ steps.baseline-checkout.outcome == 'success' }}
        uses: ./.github/composite/scan-nuget-transitive-dependencies
        with:
          checkout-dir: ${{ github.workspace }}/${{ env.BASELINE_DIR }}
          package-levels: ${{ env.PACKAGE_LEVELS }}

      - name: Compare With Baseline
        id: compare
        uses: ./.github/composite/scan-result-compare
        with:
          sarif-file: ${{ steps.scan.outputs.sarif-file }}
          baseline-sarif-file: ${{ steps.baseline-scan.outputs.sarif-file }}
          tool-name: ${{ env.TOOL_NAME }}

      - name: Compare Baseline With Baseline Alerts
        id: baseline-alerts
        if: ${{ steps.baseline-scan.outcome == 'success' }}
        uses: ./.github/composite/scan-result-compare
        with:
          sarif-file: ${{ steps.baseline-scan.outputs.sarif-file }}
          tool-name: ${{ env.TOOL_NAME }}

      - name: Dispatch Baseline Scan
        if: ${{ steps.baseline-alerts.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh workflow run "$BASELINE_WORKFLOW" --ref "$BASELINE_BRANCH"; then
            echo "Dispatched $BASELINE_WORKFLOW on $BASELINE_BRANCH to refresh its code scanning alerts"
          else
            echo "::warning::Unable to dispatch $BASELINE_WORKFLOW on $BASELINE_BRANCH, its code scanning alerts stay stale until the next scheduled scan"
          fi

      - name: Upload SARIF
        if: ${{ inputs.upload-sarif }}
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # 4.37.6
        with:
          sarif_file: ${{ steps.scan.outputs.sarif-file }}
          category: nuget-transitive-dependencies

      - name: Evaluate Scan Result
        id: evaluate
        env:
          JSON_FILE: ${{ steps.scan.outputs.json-file }}
          CHANGES: ${{ steps.compare.outputs.changes }}
        run: |
          VULNERABLE=$(jq -r '[.projects[]?.frameworks[]? as $f | $ARGS.positional[] as $level | ($f[$level] // [])[]] | length' "$JSON_FILE" --args ${{ env.PACKAGE_LEVELS }})
          echo "vulnerable=$VULNERABLE" >> "$GITHUB_OUTPUT"
          echo "Found $VULNERABLE vulnerable dependencies, ${{ steps.compare.outputs.added-count }} of them new"

          {
            echo "summary<<EOF_SUMMARY"
            if [ -n "$CHANGES" ]; then
              echo "$CHANGES"
            fi
            echo '```'
            cat "$JSON_FILE"
            echo '```'
            echo "EOF_SUMMARY"
          } >> "$GITHUB_OUTPUT"

      - name: Fail If New Vulnerabilities
        if: ${{ inputs.fail-on-vulnerable && steps.compare.outputs.added-count != '0' }}
        env:
          SUMMARY: ${{ steps.evaluate.outputs.summary }}
        run: |
          {
            echo "## Vulnerabilities found in Transitive Dependencies"
            echo "$SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Found ${{ steps.compare.outputs.added-count }} new vulnerable transitive dependencies, out of ${{ steps.evaluate.outputs.vulnerable }} in total"
          exit 1

      - name: Report Pull Request
        if: ${{ inputs.report-pull-request }}
        uses: ./.github/composite/report-pull-request
        with:
          branch-name: "vulnerability-scan/nuget-transitive-dependencies"
          open: ${{ steps.evaluate.outputs.vulnerable != '0' }}
          changed: ${{ steps.compare.outputs.changed }}
          title: "Vulnerabilities found in Transitive Dependencies"
          summary: ${{ steps.evaluate.outputs.summary }}
